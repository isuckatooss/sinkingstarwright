name: Feature request
description: An idea for Sinking StarWright.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first, and add a 👍 to one that's yours already.

  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe what you'd like the app to do, and why it would help you.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: An example
      description: A level or puzzle you'd make with it, a sketch, a screenshot from the game, anything that shows it.
    validations:
      required: false
